[project]
name = "senpilot-agent"
version = "0.1.0"
description = "Email agent that fetches and zips filings from the Nova Scotia UARB public documents database"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "agentmail>=2.0.18",
    "anthropic>=2.3.0",
    "playwright>=1.64.1",
    "python-dotenv>=1.2.4",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
